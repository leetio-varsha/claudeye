<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claudeye</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="win">
    <header class="titlebar" data-tauri-drag-region>
      <div class="tb-title" data-tauri-drag-region>Claudeye</div>
      <!-- drag-region работает только если атрибут стоит на САМОМ элементе под курсором,
           дети без атрибута перехватывают mousedown — поэтому дублируем на всех потомках -->
      <div class="tb-status" id="hookStatus" data-tauri-drag-region>
        <span class="dot" id="hookDot" data-tauri-drag-region></span><span id="hookText" data-tauri-drag-region>проверяю…</span>
      </div>
    </header>

    <div class="body">
      <nav class="sidebar" id="nav">
        <button class="navitem on" data-view="overview"><i data-icon="dashboard"></i><span>Обзор</span></button>
        <button class="navitem" data-view="sessions"><i data-icon="list"></i><span>Сессии</span></button>
        <button class="navitem" data-view="notifications"><i data-icon="bell"></i><span>Уведомления</span><span class="badge" id="navBadge" hidden>0</span></button>
        <button class="navitem" data-view="controls"><i data-icon="sliders"></i><span>Управление</span></button>
        <div class="side-foot">
          <div class="db-line"><i data-icon="db"></i><span id="dbLine">mem.db</span></div>
          <button class="refresh" id="refreshBtn" title="Обновить"><i data-icon="refresh"></i></button>
        </div>
      </nav>

      <main class="content" id="content"></main>
    </div>
  </div>

  <script src="./vendor/chart.umd.js"></script>
  <script src="./app.js"></script>
</body>
</html>
